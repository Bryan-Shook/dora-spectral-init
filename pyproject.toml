[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dora-spectral-init"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = ["torch==2.6.0", "numpy", "pyyaml"]

[project.optional-dependencies]
models = [
  "transformers",
  "datasets",
  "peft==0.18.1",
  "accelerate",
  "safetensors",
  "huggingface-hub",
]
analysis = ["scipy", "matplotlib"]
# Choose cpu or cuda when syncing.
cpu = ["torch"]
cuda = ["torch; sys_platform == 'linux'"]

[dependency-groups]
dev = ["pytest", "ruff"]
notebooks = ["jupyterlab", "ipykernel", "pandas"]


[tool.hatch.build.targets.wheel]
packages = ["src/dora_spectral"]

[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'", extra = "cpu" },
  # The 2.6.0 cu126 index mixes wheel metadata across architectures.
  { url = "https://download.pytorch.org/whl/cu126/torch-2.6.0%2Bcu126-cp311-cp311-manylinux_2_28_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'", extra = "cuda" },
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine != 'x86_64'", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 100
extend-exclude = ["references", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
